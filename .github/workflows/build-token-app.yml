name: Build EHG Token Extractor APK

on:
  push:
    paths:
      - 'tools/ehg-token-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ehg-token-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.11

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ehg-token-extractor-debug
          path: tools/ehg-token-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
