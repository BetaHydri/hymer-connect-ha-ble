name: Build EHG Token Extractor APK

on:
  push:
    paths:
      - 'tools/ehg-token-app/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the APK to (optional, e.g. v2.62.25)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: tools/ehg-token-app

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.11

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ehg-token-extractor.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v5
        with:
          name: ehg-token-extractor-debug
          path: tools/ehg-token-app/app/build/outputs/apk/debug/ehg-token-extractor.apk
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TARGET_TAG" app/build/outputs/apk/debug/ehg-token-extractor.apk --clobber --repo "${{ github.repository }}"
